<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/tauri.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nexo — an AI thinking workspace where ideas become structured concepts and visual relationships." />
    <title>Nexo</title>
    <script>
      // Apply the stored theme and language before first paint to avoid a flash.
      (function () {
        try {
          var mode = localStorage.getItem("nexo.theme") || "system";
          var dark = mode === "dark" || (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.add(dark ? "dark" : "light");
          root.style.colorScheme = dark ? "dark" : "light";
          var lang = localStorage.getItem("nexo.language");
          if (lang) root.lang = lang;
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
